<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://de1.api.radio-browser.info https://de2.api.radio-browser.info; media-src https:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="theme-color" content="#000000" />
    <title>NaviGlass</title>
    <link
      rel="icon"
      href="icon-32.png?v=0.2.5"
      type="image/png"
      sizes="32x32"
    />
    <link
      rel="icon"
      href="icon.svg?v=0.2.5"
      type="image/svg+xml"
      sizes="any"
    />
    <link rel="apple-touch-icon" href="icon-180.png?v=0.2.5" />
    <link rel="stylesheet" href="style.css" />
    <script src="vendor/three.min.js" defer></script>
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header id="playbackStrip">
      <button id="repeat" aria-label="Repeat"></button>
      <div class="seekTime">
        <span id="elapsed">0:00</span> / <span id="duration">--:--</span>
      </div>
      <input
        id="seek"
        type="range"
        min="0"
        max="1000"
        value="0"
        aria-label="Playback position"
      /><button id="search" aria-label="Search music"></button
      ><button id="volume" aria-label="Volume"></button
      ><button id="shuffle" aria-label="Shuffle"></button>
    </header>
    <main>
      <div
        id="scene"
        aria-label="Album Cover Flow. Swipe left or right to browse."
        tabindex="0"
      ></div>
      <section id="content" hidden aria-label="Music browser"></section>
      <section id="caption" aria-live="polite" hidden>
        <h1 id="title">Your music. In motion.</h1>
        <p id="subtitle">Local files or your Navidrome library.</p>
        <button
          id="nowFavourite"
          aria-label="Favourite playing song"
          hidden
        ></button>
        <button
          id="infoMenu"
          aria-label="Album information and song actions"
        ></button>
      </section>
      <section id="welcome">
        <img src="icon.svg" alt="NaviGlass" />
        <h2>Meet your music again.</h2>
        <p>
          Your local collection and Navidrome library, in the familiar NaviGlass
          Cover Flow.
        </p>
        <button class="primary" id="device">Load device music</button
        ><button id="folder">Choose a music folder</button
        ><button id="connectWelcome">Connect Navidrome</button
        ><small>Read-only music access · Android 10+</small>
      </section>
    </main>
    <footer id="controls">
      <div class="now" hidden>
        <strong id="nowTitle">Nothing playing</strong
        ><span id="nowArtist"></span>
      </div>
      <div class="transport">
        <div class="primaryTransport">
          <button id="previous" aria-label="Previous song"></button
          ><button class="play" id="play" aria-label="Play"></button
          ><button id="next" aria-label="Next song"></button>
        </div>
        <div class="coverBrowse">
          <button id="backAlbum" aria-label="Previous cover">◀</button
          ><input
            id="browseStrip"
            type="range"
            min="0"
            max="0"
            step="1"
            value="0"
            aria-label="Browse covers"
          /><button id="nextAlbum" aria-label="Next cover">▶</button>
        </div>
        <button id="songs" aria-label="Open album songs"></button>
      </div>
      <nav id="mainNav" aria-label="Music navigation">
        <button data-view="albums" aria-current="page">
          <span class="navIcon"></span><span>Albums</span></button
        ><button data-view="songs">
          <span class="navIcon"></span><span>Songs</span></button
        ><button data-view="artists">
          <span class="navIcon"></span><span>Artists</span></button
        ><button data-view="playlists">
          <span class="navIcon"></span><span>Playlist</span></button
        ><button data-view="more">
          <span class="navIcon"></span><span>More</span></button
        ><button data-view="settings" id="library">
          <span class="navIcon"></span><span>Settings</span>
        </button>
      </nav>
      <span id="albumPosition" hidden></span>
    </footer>
    <button id="fullscreen" aria-label="Toggle immersive player"></button>
    <dialog id="panel">
      <div class="panelHead">
        <h2 id="panelTitle">Library</h2>
        <span id="drawerCount" hidden></span
        ><button
          id="drawerFavourite"
          aria-label="Favourite album"
          hidden
        ></button
        ><button id="close" aria-label="Close panel"></button>
      </div>
      <div id="panelBody"></div>
    </dialog>
    <div id="scan" hidden>
      <span id="scanText"></span
      ><progress aria-label="Scanning music"></progress
      ><button id="cancel">Cancel scan</button>
    </div>
    <div id="toast" role="status" hidden></div>
  </body>
</html>
